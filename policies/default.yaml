# pay-warden policy — every request_purchase is evaluated against this file.
# Amounts are strings to keep exact decimal semantics (like Prava's API).
version: 1

currencies: [USD, GBP, EUR, INR]

# Every budget, cap and threshold below is denominated in base_currency.
# Amounts in other currencies are converted with these rates before any
# comparison — otherwise 100 INR would count the same as 100 USD against a
# budget, and pricing a purchase in a weaker currency would slip the cap.
# A policy listing more than one currency must supply a rate for each.
base_currency: USD
rates:
  USD: "1.00"
  GBP: "1.27"
  EUR: "1.09"
  INR: "0.012"

agents:
  demo-shopper:
    daily_budget: "50.00"
    max_single_purchase: "25.00"
  rogue-agent:
    daily_budget: "10.00"
    max_single_purchase: "5.00"
  # Headroom above human_approval_over, so large requests reach the escalation
  # rule instead of being stopped earlier by the single-purchase cap.
  ops-agent:
    daily_budget: "500.00"
    max_single_purchase: "250.00"

merchants:
  # Empty allow-list means any merchant not denied is permitted.
  allow: []
  deny:
    - "*.casino.example"
    - "sketchy-deals.example"

velocity:
  max_purchases: 3
  window_minutes: 60

# Above this amount the request parks as needs_approval for a human,
# even if every other rule passes.
human_approval_over: "100.00"
