[project]
name = "pay-warden"
version = "0.1.0"
description = "Policy firewall for AI-agent spending, built on Prava"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pay_warden"]

[tool.pytest.ini_options]
testpaths = ["tests"]
